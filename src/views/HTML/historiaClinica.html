<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Mascotas | PetCare</title>

    <link rel="stylesheet" href="../static/CSS/_theme.css">
    <link rel="stylesheet" href="../static/CSS/historiaClinica.css">
</head>

<body>

<header class="container">
    <nav>
        <a href="/" class="nav-logo">
            <img src="../static/images/logocare1.webp">
        </a>
        <div class="nav-buttons">
            <a href="/myPets" class="nav-button">Mis Mascotas</a>
            <a href="/serv" class="nav-button">Servicios</a>
        </div>
    </nav>
</header>

<main class="main-container">

    <section class="pets-container">
        <h2 class="section-title">🐾 Mis Mascotas</h2>
        <p class="section-description">
            Selecciona una mascota para ver su historial médico
        </p>

        <!-- 🔥 ESTE ES EL CONTENEDOR CLAVE -->
        <div id="petsGrid" class="pets-grid"></div>
    </section>

    <!-- HISTORIAL -->
    <section id="historyContainer" class="history-container" style="display:none;">
        <h3>📋 Historial Médico</h3>
        <ul id="historyList" class="history-list"></ul>

        <form id="modifyHistoryForm" class="update-section">
            <div class="form-group">
                <label>Vacunas</label>
                <input type="text" id="vaccines">
            </div>

            <div class="form-group">
                <label>Observaciones</label>
                <textarea id="observations"></textarea>
            </div>

            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="consult_date">
            </div>

            <button class="action-button save-button">
                💾 Guardar historial
            </button>
        </form>
    </section>

</main>

<!-- ✅ SCRIPT CORRECTO -->
<script src="../static/JS/myPets.js"></script>

</body>
</html>
