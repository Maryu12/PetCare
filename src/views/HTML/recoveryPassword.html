<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/CSS/recoveryPassword.css">
    <title>Recuperar Contraseña</title>
</head>

<body>  
    <!-- Mensajes desde el servidor -->
    {% if register_error %}
        <div class="alert error">
            {{ register_error }}
        </div>
    {% endif %}

    <div class="logo-container">
        <img src="../static/images/logopet2.webp" alt="logo-container" >
    </div>
    <div class="back-button-container">
        <a href="/login" class="back-button">Login</a>
    </div>
    <div class="container" id="container">
        <div class="form-container">
            <form action="/recoveryPassword" method="post">
                <h1>Recuperar Contraseña</h1>
                
                <label for="email" class="sr-only">Email</label>
                <input id="email" type="email" name="email" placeholder="Email" required>
                <label for="new_password" class="sr-only">Nueva contraseña</label>
                <input id="new_password" type="password" name="new_password" placeholder="Nueva Contraseña"
                required 
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}$"
                oninvalid="this.setCustomValidity('La contraseña debe tener mínimo 8 caracteres, incluir una minúscula, una mayúscula y un carácter especial')"
                oninput="this.setCustomValidity('')">
                <label for="confirm_password" class="sr-only">Repetir contraseña</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Repetir Contraseña" minlength="8" autocomplete="new-password" required>
                <button type="submit">Cambiar</button>
            </form>
        </div>
    </div>

</body>
</html>
